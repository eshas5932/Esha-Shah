<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Museum Pediment (Roof Triangle) -->
  <polygon points="32,10 11,23 53,23" fill="url(#glowBlue)" filter="url(#neonGlow)"/>
  
  <!-- Pediment Star / Core -->
  <circle cx="32" cy="18" r="2.5" fill="#ffffff" />

  <!-- Architrave Beam -->
  <rect x="12" y="24" width="40" height="3" rx="1" fill="#93c5fd"/>

  <!-- 4 Classical Columns -->
  <!-- Column 1 -->
  <rect x="15" y="29" width="5" height="18" rx="1" fill="#60a5fa"/>
  <rect x="14" y="28" width="7" height="2" fill="#bfdbfe"/>
  <rect x="14" y="46" width="7" height="2" fill="#bfdbfe"/>

  <!-- Column 2 -->
  <rect x="25" y="29" width="5" height="18" rx="1" fill="#38bdf8"/>
  <rect x="24" y="28" width="7" height="2" fill="#bfdbfe"/>
  <rect x="24" y="46" width="7" height="2" fill="#bfdbfe"/>

  <!-- Column 3 -->
  <rect x="34" y="29" width="5" height="18" rx="1" fill="#38bdf8"/>
  <rect x="33" y="28" width="7" height="2" fill="#bfdbfe"/>
  <rect x="33" y="46" width="7" height="2" fill="#bfdbfe"/>

  <!-- Column 4 -->
  <rect x="44" y="29" width="5" height="18" rx="1" fill="#60a5fa"/>
  <rect x="43" y="28" width="7" height="2" fill="#bfdbfe"/>
  <rect x="43" y="46" width="7" height="2" fill="#bfdbfe"/>

  <!-- Base Steps -->
  <rect x="10" y="49" width="44" height="3.5" rx="1" fill="#93c5fd"/>
  <rect x="7" y="53.5" width="50" height="3" rx="1" fill="url(#glowBlue)"/>
</svg>
